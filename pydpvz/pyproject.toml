[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.10.0", "wheel", "mpi4py>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydpvz"
version = "0.1.0"
description = "Python bindings for Sandia National Laboratories DPvz parallel I/O library"
authors = [{ name = "AllVibes Project" }]
dependencies = [
    "mpi4py>=3.0.0"
]
readme = "README.md"
requires-python = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
